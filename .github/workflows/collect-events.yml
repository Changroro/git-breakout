name: Collect public GitHub event signals

on:
  schedule:
    - cron: "7 0-22/2 * * *"
  workflow_dispatch:

concurrency:
  group: trend-radar-event-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect two completed GH Archive hours
        env:
          TREND_RADAR_API_URL: ${{ vars.TREND_RADAR_API_URL }}
          TREND_RADAR_COLLECTOR_TOKEN: ${{ secrets.TREND_RADAR_COLLECTOR_TOKEN }}
        run: |
          for offset in 3 2; do
            bucket_at=$(date -u -d "$offset hours ago" +'%Y-%m-%dT%H:00:00.000Z')
            npm run collect:events:remote -- --hour="$bucket_at" --limit=5000
          done
